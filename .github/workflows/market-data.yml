name: Update Market Data

on:
  schedule:
    - cron: "*/10 1-5 * * 1-5"   # 台股交易時段 09:00–13:59（台北時間），每 10 分鐘抓一次
    - cron: "30 9 * * 1-5"       # 17:30（台北時間）盤後定稿一次
  workflow_dispatch: {}          # 也可在 Actions 頁手動執行

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch prices (Yahoo)
        run: node scripts/fetch-prices.mjs
      - name: Fetch market data (TWSE)
        run: node scripts/fetch-market.mjs
      - name: Commit & push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A prices.json market.json
          if git diff --cached --quiet; then
            echo "no data changes"
          else
            git commit -m "chore: update prices/market data [skip ci]"
            git push
          fi
