name: Update Market Data

on:
  schedule:
    - cron: "*/10 1-5 * * 1-5"   # 台股交易時段 09:00–13:59（台北時間），每 10 分鐘抓一次
    - cron: "30 9 * * 1-5"       # 17:30（台北時間）盤後定稿一次
  workflow_dispatch: {}          # 也可在 Actions 頁手動執行

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch prices — 盤中只更新報價
        if: github.event_name != 'workflow_dispatch' && github.event.schedule != '30 9 * * 1-5'
        env:
          FUGLE_API_KEY: ${{ secrets.FUGLE_API_KEY }}
          SKIP_CANDLES: "1"
        run: node scripts/fetch-prices.mjs
      - name: Fetch prices — 盤後／手動：全市場報價 + 分批補日 K
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '30 9 * * 1-5'
        env:
          FUGLE_API_KEY: ${{ secrets.FUGLE_API_KEY }}
        run: |
          for i in 1 2 3 4 5 6; do
            echo "── 日 K 分片 $i/6 ──"
            SHARD="$i/6" node scripts/fetch-prices.mjs || echo "shard $i failed"
          done
      - name: Fetch market data (TWSE)
        run: node scripts/fetch-market.mjs
      - name: Fetch index history (TWSE MI_INDEX)
        continue-on-error: true
        run: node scripts/fetch-index-history.mjs
      - name: Fetch logos (TradingView)
        continue-on-error: true
        run: node scripts/fetch-logos.mjs
      - name: Fetch crypto logos (CoinGecko)
        continue-on-error: true
        run: node scripts/fetch-crypto-logos.mjs
      - name: Commit & push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A prices.json market.json logos.json crypto-logos.json index-history.json
          if git diff --cached --quiet; then
            echo "no data changes"
          else
            git commit -m "chore: update prices/market data [skip ci]"
            git push
          fi
