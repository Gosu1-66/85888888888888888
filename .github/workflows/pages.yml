name: Update Market Data (manual)

# 排程已集中在 market-data.yml，這裡只保留手動執行，避免兩個 workflow 重複跑。
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch prices (Yahoo)
        run: node scripts/fetch-prices.mjs
      - name: Fetch market data (TWSE)
        run: node scripts/fetch-market.mjs
      - name: Commit & push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A prices.json market.json
          if git diff --cached --quiet; then
            echo "no data changes"
          else
            git commit -m "chore: update prices/market data [skip ci]"
            git push
          fi
