name: Update Market Data

on:
  schedule:
    - cron: "45 5 * * *"   # 每日 13:45 (UTC+8) 盤中
    - cron: "0 12 * * *"   # 每日 20:00 (UTC+8) 盤後
  workflow_dispatch: {}     # 也可在 Actions 頁手動執行

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch prices (Yahoo)
        run: node scripts/fetch-prices.mjs
      - name: Fetch market data (TWSE)
        run: node scripts/fetch-market.mjs
      - name: Commit & push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A prices.json market.json
          if git diff --cached --quiet; then
            echo "no data changes"
          else
            git commit -m "chore: update prices/market data [skip ci]"
            git push
          fi
