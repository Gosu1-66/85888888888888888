name: Update Margin Data

on:
  schedule:
    - cron: "*/15 1-6 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  margin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch margin (TWSE MI_MARGN)
        run: node scripts/fetch-margin.mjs
      - name: Commit margin.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add margin.json
          if git diff --cached --quiet; then
            echo "no margin changes"
          else
            git commit -m "chore: update margin data [skip ci]"
            git push
          fi
